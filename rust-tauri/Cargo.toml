[package]
name = "nocturna-logger-tauri"
version = "0.1.4"
edition = "2021"
description = "Tauri-specific logger extensions — app-data file sink, IPC bridge, and panic handlers for the Nocturna logging spec"
license = "MIT"
repository = "https://github.com/nocturna/logger"
keywords = ["logger", "tauri", "ipc", "structured"]
categories = ["development-tools::debugging"]

[dependencies]
nocturna-logger = { path = "../rust-cli", version = "0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Optional: enable the "tauri" feature for the AppHandle file-sink wrapper
# and the #[tauri::command] entry point. Tauri's Linux dependency tree
# (gtk/webkit sys crates) needs pkg-config + system libraries to build,
# so it stays off by default — the pure logic (handle_log_payload) and
# the version-parity tests never require it.
tauri = { version = "2", optional = true, default-features = false }

[features]
tauri = ["dep:tauri"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
