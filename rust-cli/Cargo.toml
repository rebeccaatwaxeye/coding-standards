[package]
name = "nocturna-logger"
version = "0.1.3"
edition = "2021"
description = "Zero-config structured logger for Rust — reference implementation of the Nocturna logging spec (§14)"
license = "MIT"
repository = "https://github.com/nocturna/logger"
keywords = ["logger", "logging", "structured", "tracing"]
categories = ["development-tools::debugging"]

[dependencies]
chrono = "0.4"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
filetime = "0.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
