version: 49
jobs:
- name: CI
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    condition: SUCCESSFUL
  - type: SetupCacheStep
    name: set-up-pnpm-cache
    key: pnpm-store
    uploadStrategy: UPLOAD_IF_NOT_EXACT_MATCH
    condition: SUCCESSFUL
    checksumFiles: pnpm-lock.yaml
    entries:
    - path: /root/.pnpm-store
    - path: node_modules
  - type: CommandStep
    name: install
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      commands: 'corepack enable

        pnpm config set store-dir /root/.pnpm-store

        pnpm install --frozen-lockfile

        '
      shell: sh
    condition: SUCCESSFUL
    runAs: 0:0
  - type: CommandStep
    name: typecheck
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      commands: 'pnpm --filter @nocturna/logger run typecheck

        pnpm --filter @nocturna/logger-electron run typecheck

        '
      shell: sh
    condition: SUCCESSFUL
    runAs: 0:0
  - type: CommandStep
    name: test
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      commands: 'pnpm --filter @nocturna/logger run test

        pnpm --filter @nocturna/logger-electron run test

        '
      shell: sh
    condition: SUCCESSFUL
    runAs: 0:0
  - type: CommandStep
    name: build
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      commands: 'pnpm --filter @nocturna/logger run build

        pnpm --filter @nocturna/logger-electron run build

        '
      shell: sh
    condition: SUCCESSFUL
    runAs: 0:0
  triggers:
  - type: BranchUpdateTrigger
  timeout: 3600
  retryCondition: never
  maxRetries: 0
  retryDelay: 30
- name: Publish
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    condition: SUCCESSFUL
  - type: SetupCacheStep
    name: set-up-pnpm-cache
    key: pnpm-store
    uploadStrategy: UPLOAD_IF_NOT_EXACT_MATCH
    condition: SUCCESSFUL
    checksumFiles: pnpm-lock.yaml
    entries:
    - path: /root/.pnpm-store
    - path: node_modules
  - type: CommandStep
    name: install
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      commands: 'corepack enable

        pnpm config set store-dir /root/.pnpm-store

        pnpm install --frozen-lockfile

        '
      shell: sh
    condition: SUCCESSFUL
    runAs: 0:0
  - type: CommandStep
    name: validate
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      commands: 'pnpm --filter @nocturna/logger run typecheck

        pnpm --filter @nocturna/logger-electron run typecheck

        pnpm --filter @nocturna/logger run test

        pnpm --filter @nocturna/logger-electron run test

        '
      shell: sh
    condition: SUCCESSFUL
    runAs: 0:0
  - type: CommandStep
    name: build
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      commands: 'pnpm --filter @nocturna/logger run build

        pnpm --filter @nocturna/logger-electron run build

        '
      shell: sh
    condition: SUCCESSFUL
    runAs: 0:0
  - type: CommandStep
    name: publish
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      commands: 'set -e

        npm config set @nocturna:registry $OneDev_server_url/$project_path/~npm/

        npm config set -- ''//$OneDev_server_url/$project_path/~npm/:_authToken'' "@job_token@:@secret:access-token@"

        # Core first, then electron (its workspace:* dep resolves to a concrete version)

        pnpm --filter @nocturna/logger publish --no-git-checks

        pnpm --filter @nocturna/logger-electron publish --no-git-checks


        '
      shell: sh
    condition: SUCCESSFUL
    runAs: 0:0
  triggers:
  - type: TagCreateTrigger
    tags: v*
  timeout: 1800
  retryCondition: never
  maxRetries: 0
  retryDelay: 30
