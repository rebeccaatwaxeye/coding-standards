version: 56
jobs:
- name: CI
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: network-probe
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        node -e "const t=(u)=>Promise.race([fetch(u,{redirect:'manual'}).then(r=>'HTTP '+r.status),new Promise((_,re)=>setTimeout(()=>re(new Error('TIMEOUT-8s')),8000))]).catch(e=>e.message);Promise.all([t('https://registry.npmjs.org/pnpm'),t('https://nocturna.dev/coding-standards/~npm/pnpm'),t('https://nocturna.dev')]).then(r=>console.log('REACHABILITY '+r.join(' | '))).catch(e=>console.log('PROBE-FAIL',e.message))"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: install
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        corepack enable
        pnpm config set store-dir /root/.pnpm-store
        pnpm install --frozen-lockfile
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: lint
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        cd node
        node_modules/.bin/biome check src/
        cd ../electron
        node_modules/.bin/biome check src/
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        cd node
        node_modules/.bin/tsup
        cd ../electron
        node_modules/.bin/tsup
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: typecheck
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        cd node
        node_modules/.bin/tsc --noEmit
        cd ../electron
        node_modules/.bin/tsc --noEmit
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: test
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        cd node
        timeout 90s node_modules/.bin/vitest run --testTimeout=15000 --no-file-parallelism --reporter=verbose
        cd ../electron
        timeout 90s node_modules/.bin/vitest run --testTimeout=15000 --no-file-parallelism --reporter=verbose
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: rust-lint
    runInContainer: true
    image: rust:1-slim
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        rustup component add rustfmt clippy
        cd rust-cli
        cargo fmt --check
        cargo clippy --all-targets -- -D warnings
        cd ../rust-tauri
        cargo fmt --check
        cargo clippy --all-targets -- -D warnings
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: rust-test
    runInContainer: true
    image: rust:1-slim
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        cd rust-cli
        cargo test
        cd ../rust-tauri
        cargo test
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: python-lint
    runInContainer: true
    image: python:3.12-slim
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        pip install --quiet ruff
        cd python
        ruff check .
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: python-test
    runInContainer: true
    image: python:3.12-slim
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        pip install --quiet pytest pytest-cov
        cd python
        python -m pytest --cov=nocturna_logger --cov-branch --cov-fail-under=90
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: php-test
    runInContainer: true
    image: composer:2
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        cd php
        composer install --no-interaction --quiet
        vendor/bin/phpunit
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  retryCondition: never
  maxAttempts: 1
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 3600
- name: Publish
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: install
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        corepack enable
        pnpm config set store-dir /root/.pnpm-store
        pnpm install --frozen-lockfile
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: check-versions
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        node scripts/check-versions.mjs
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        corepack enable
        pnpm --filter @@nocturna/logger run build
        pnpm --filter @@nocturna/logger-electron run build
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: smoke-test
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        SMOKE=/tmp/smoke
        rm -rf "$SMOKE"
        mkdir -p "$SMOKE/pkg" "$SMOKE/extracted"
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        corepack enable
        pnpm --filter @@nocturna/logger pack --pack-destination "$SMOKE"
        pnpm --filter @@nocturna/logger-electron pack --pack-destination "$SMOKE"
        cd "$SMOKE/pkg"
        npm init --yes
        npm install "$SMOKE"/nocturna-logger-*.tgz --no-audit --no-fund --loglevel=error
        node -e "const l=require('@@nocturna/logger');const log=l.createLogger({module:'smoke',level:'ERROR',sinks:[]});log.critical('ignored');if(typeof l.consoleSink!=='function'||typeof l.fileSink!=='function'||typeof l.jsonSink!=='function'){process.exit(1);}console.log('core smoke test passed');"
        tar -xzf "$SMOKE"/nocturna-logger-electron-*.tgz -C "$SMOKE/extracted"
        node -e "const fs=require('fs');const base='$SMOKE/extracted/package';const p=require(base+'/package.json');for(const f of ['dist/index.cjs','dist/index.js','dist/preload.cjs','dist/preload.js','dist/index.d.ts','dist/preload.d.ts']){if(!fs.existsSync(base+'/'+f)){console.error('electron tarball missing '+f);process.exit(1);}}if(!p.peerDependencies||!p.peerDependencies.electron){console.error('electron peerDependency missing');process.exit(1);}console.log('electron tarball verified: '+p.version);"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: validate
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        corepack enable
        pnpm --filter @@nocturna/logger run typecheck
        pnpm --filter @@nocturna/logger-electron run typecheck
        pnpm --filter @@nocturna/logger run test
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        corepack enable
        pnpm --filter @@nocturna/logger-electron run test
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: publish
    runInContainer: true
    image: node:20-alpine
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -e
        REGISTRY="@server_url@/@project_path@/~npm/"
        npm config set @@nocturna:registry "$REGISTRY"
        npm config set -- "//${REGISTRY#*://}:username" "@job_token@"

        npm config set -- "//${REGISTRY#*://}:_password" "$(printf '%s' "@job_token@" | base64)"
        # Core first, then electron (its workspace:* dep resolves to a concrete version)
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        corepack enable
        pnpm --filter @@nocturna/logger publish --no-git-checks
        pnpm --filter @@nocturna/logger-electron publish --no-git-checks
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: TagCreateTrigger
    tags: v*
  retryCondition: never
  maxAttempts: 1
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 1800
